<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a1420">
  <title>健身房训练 · 轻健身</title>
  <link rel="stylesheet" href="/gym/styles.css">
  <link rel="stylesheet" href="/gym/modules.css">
  <link rel="stylesheet" href="/portal/shared/back-to-top.css">
  <script src="/gym/capacity-view.js"></script>
  <script src="/gym/plan-exercise-filter.js"></script>
  <script src="/portal/routes.js"></script>
  <script type="module" src="/gym/app.js"></script>
  <script defer src="/portal/shared/back-to-top.js"></script>
<link rel="stylesheet" href="/portal/shared/training-calendar.css">
<script defer src="/portal/shared/training-calendar.js"></script>
</head>
<body>
  <main class="page-shell">
    <header class="page-header">
      <a class="back-link" href="/">← 训练中心</a>
      <div class="brand-row"><div><p class="eyebrow">THIN MUSCLE · GYM</p><h1>健身房训练</h1></div><span class="account-pill" id="accountPill" hidden></span></div>
      <p class="header-copy">教练计划、训练记录和身体进度，集中在这里。</p>
    </header>

    <section class="panel auth-panel" id="authPanel">
      <div class="section-heading"><div><p class="eyebrow">ACCOUNT</p><h2 id="authHeading">登录后继续</h2></div></div>
      <form id="authForm" class="stack-form">
        <label>用户名<input id="username" autocomplete="username" minlength="3" maxlength="64" required></label>
        <label>密码<input id="password" type="password" autocomplete="current-password" minlength="6" required></label>
        <button class="button primary" id="authSubmit" type="submit">登录</button>
      </form>
      <button class="text-button" id="toggleRegister" type="button">没有账号？注册学员账号</button>
      <p class="inline-message" id="authMessage" aria-live="polite"></p>
    </section>

    <div id="workspace" hidden>
      <section data-training-calendar aria-label="训练日历"></section>
      <nav class="role-nav" id="roleNav" aria-label="工作台功能"></nav>
      <section class="panel workspace-panel" id="workspaceContent" aria-live="polite"></section>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </main>
</body>
</html>
