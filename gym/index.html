<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0E1311">
  <title>健身房训练 · 轻健身</title>
  <link rel="stylesheet" href="/portal/shared/theme.css">
  <link rel="stylesheet" href="/portal/shared/app-shell.css">
  <link rel="stylesheet" href="/gym/styles.css">
  <link rel="stylesheet" href="/gym/modules.css">
  <script src="/gym/capacity-view.js"></script>
  <script src="/gym/plan-exercise-filter.js"></script>
  <script src="/portal/routes.js"></script>
  <script type="module" src="/gym/app.js"></script>
<link rel="stylesheet" href="/portal/shared/training-calendar.css">
<script defer src="/portal/shared/training-calendar.js"></script>
</head>
<body class="app-shell-body">
  <aside class="app-rail" aria-label="主导航">
    <div class="rail-brand"><span class="brand-mark">TM</span><strong>轻健身</strong></div>
    <nav class="rail-nav">
      <a href="/">今日训练</a>
      <a href="/?view=data">数据</a>
      <button type="button" class="active" data-gym-tab="plan">计划</button>
      <button type="button" data-gym-tab="mine">我的</button>
    </nav>
    <div class="rail-user"><strong id="railAccount">未登录</strong><span id="railRole"></span></div>
  </aside>

  <main class="app-main">
    <div class="page-top"><h1 id="pageTitle">计划</h1><span class="account-pill" id="accountPill" hidden></span></div>
    <nav class="source-switch" aria-label="训练来源">
      <a href="/">居家</a>
      <a href="/gym/" class="active" aria-current="page">健身房</a>
      <a href="/member/">会员自助</a>
    </nav>

    <section class="panel auth-panel" id="authPanel">
      <div class="section-heading"><div><h2 id="authHeading">登录后继续</h2></div></div>
      <form id="authForm" class="stack-form">
        <label>用户名<input id="username" autocomplete="username" minlength="3" maxlength="64" required></label>
        <label>密码<input id="password" type="password" autocomplete="current-password" minlength="6" required></label>
        <button class="button primary" id="authSubmit" type="submit">登录</button>
      </form>
      <button class="text-button" id="toggleRegister" type="button">没有账号？注册学员账号</button>
      <p class="inline-message" id="authMessage" aria-live="polite"></p>
    </section>

    <div id="workspace" hidden>
      <section id="gymCalendar" data-training-calendar aria-label="训练日历"></section>
      <div id="gymSectionNav"></div>
      <section id="workspaceContent" aria-live="polite"></section>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </main>

  <nav class="bottom-nav" aria-label="底部导航">
    <a href="/"><i></i>今日</a>
    <a href="/?view=data"><i></i>数据</a>
    <button type="button" class="active" data-gym-tab="plan"><i></i>计划</button>
    <button type="button" data-gym-tab="mine"><i></i>我的</button>
  </nav>
</body>
</html>
